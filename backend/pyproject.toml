[project]
name = "relayforge"
version = "0.1.0"
description = "Effect-safe local coding-agent runtime"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0.40,<2.1",
  "alembic>=1.15,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "langsmith>=0.14,<1",
  "mcp==2.3.0",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relayforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires a real PostgreSQL server", "docker: requires Docker Engine"]

[tool.ruff]
target-version = "py311"
line-length = 100
